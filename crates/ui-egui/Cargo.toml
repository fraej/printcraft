[package]
name = "printcraft-ui-egui"
description = "The egui shell of PrintCraft"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
printcraft-engine = { workspace = true }
printcraft-render = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "persistence", "links"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
png = "0.18"
base64 = "0.22"

# Android has no file dialog to wait on: the in-app browser answers instead (src/pick.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { workspace = true }
# Screen readers. On Android eframe offers it only with GameActivity (PrintCraft uses NativeActivity).
eframe = { workspace = true, features = ["accesskit"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Control-channel tokens.
getrandom = "0.4"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
# Create ▸ Clipboard (images; already in the tree through egui-winit). No Android backend.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url"] }

[dev-dependencies]
printcraft-cos = { workspace = true }
printcraft-model = { workspace = true }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
